<style>
  .internal-link.has-preview { text-decoration: none; position: relative; }
  #tooltip-wrapper {
    position: absolute; display: none; z-index: 99999;
    width: 400px; max-width: calc(100vw - 24px);
    background: var(--bg-elevated); color: var(--text-main);
    border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.06);
    font-size: 0.95rem; pointer-events: auto; overflow: hidden;
    opacity: 0; transform: scale(0.95) translateY(-4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  #tooltip-wrapper.visible {
    opacity: 1; transform: scale(1) translateY(0);
  }
  #tooltip-wrapper .tp-header {
    padding: 0.5rem 0.75rem 0.35rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg-base);
  }
  #tooltip-wrapper .tp-title {
    font-weight: 600; font-size: 0.95rem; line-height: 1.4;
    color: var(--text-main); margin: 0;
  }
  #tooltip-wrapper .tp-meta {
    font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem;
    letter-spacing: 0.01em;
  }
  #tooltip-wrapper .tp-body {
    max-height: 260px; overflow-y: auto;
    padding: 0.4rem 0.7rem;
    scrollbar-width: thin;
  }
  #tooltip-wrapper.tp-image .tp-body {
    max-height: none;
    padding: 0;
  }
  #tooltip-wrapper .tp-body > :first-child { margin-top: 0; }
  #tooltip-wrapper .tp-body > :last-child { margin-bottom: 0; }
  #tooltip-wrapper .tp-body h1,
  #tooltip-wrapper .tp-body h2,
  #tooltip-wrapper .tp-body h3,
  #tooltip-wrapper .tp-body h4 {
    font-size: 1rem; margin: 0.6rem 0 0.3rem;
    font-weight: 600; line-height: 1.3;
  }
  #tooltip-wrapper .tp-body h2 { font-size: 0.95rem; }
  #tooltip-wrapper .tp-body h2::after { display: none; }
  #tooltip-wrapper .tp-body p {
    margin: 0.4rem 0; line-height: 1.55;
    color: var(--text-main); font-size: 0.85rem;
  }
  #tooltip-wrapper .tp-body a {
    color: var(--accent); text-decoration: underline;
    text-underline-offset: 2px; border-bottom: none;
  }
  #tooltip-wrapper .tp-body ul, #tooltip-wrapper .tp-body ol {
    padding-left: 1.2rem; margin: 0.3rem 0; font-size: 0.85rem;
  }
  #tooltip-wrapper .tp-body li { margin: 0.15rem 0; }
  #tooltip-wrapper .tp-body img {
    max-width: 100%; height: auto; border-radius: 6px;
    margin: 0.4rem 0;
  }
  #tooltip-wrapper .tp-body code {
    font-size: 0.8em; background: var(--hover-bg);
    padding: 0.15rem 0.3rem; border-radius: 4px;
  }
  #tooltip-wrapper .tp-body pre {
    margin: 0.4rem 0; padding: 0.6rem; border-radius: 6px;
    font-size: 0.75rem; overflow-x: auto;
    background: var(--bg-base);
  }
  #tooltip-wrapper .tp-body pre code { background: none; padding: 0; }
  #tooltip-wrapper .tp-body blockquote {
    margin: 0.4rem 0; padding: 0.2rem 0 0.2rem 0.8rem;
    border-left: 2px solid var(--border); font-size: 0.85rem;
    color: var(--text-muted);
  }
  #tooltip-wrapper .tp-body .heading-anchor { display: none; }
  #tooltip-wrapper .tp-body .nepal-loading,
  #tooltip-wrapper .tp-body .map-dashboard,
  #tooltip-wrapper .tp-body #nepal-map-wrapper { display: none; }
  #tooltip-wrapper .tp-body .pg-grid { column-count: 2; column-gap: 0.3rem; }
  #tooltip-wrapper .tp-body .pg-caption { font-size: 0.7rem; padding: 0.3rem 0.5rem; }
  #tooltip-wrapper .tp-loading {
    padding: 1.5rem; text-align: center; color: var(--text-muted);
    font-size: 0.85rem;
  }
  @media (max-width:640px) { #tooltip-wrapper { display: none !important; } }
</style>

<div id="tooltip-wrapper" aria-hidden="true">
  <div class="tp-header">
    <div class="tp-title"></div>
    <div class="tp-meta"></div>
  </div>
  <div class="tp-body"></div>
</div>

<script>
  (function(){
    const selector = '{{ include.wrapperQuerySelector | default: ".garden-flow" }}';
    const wrapper = document.getElementById('tooltip-wrapper');
    const tpTitle = wrapper.querySelector('.tp-title');
    const tpMeta = wrapper.querySelector('.tp-meta');
    const tpBody = wrapper.querySelector('.tp-body');
    const cache = new Map();
    let hideTimer = null;
    let activeRequest = 0;

    function positionTooltip(elem){
      const rect = elem.getBoundingClientRect();
      const scrollY = window.scrollY || window.pageYOffset;
      const scrollX = window.scrollX || window.pageXOffset;

      var prevDisplay = wrapper.style.display;
      var prevVisibility = wrapper.style.visibility;
      wrapper.style.visibility = 'hidden';
      wrapper.style.display = 'block';
      var w = wrapper.offsetWidth || 400;
      var h = wrapper.offsetHeight || 300;
      wrapper.style.display = prevDisplay;
      wrapper.style.visibility = prevVisibility;

      let left = scrollX + rect.left + rect.width / 2 - w / 2;
      let top = scrollY + rect.top + rect.height + 10;
      const margin = 12;

      if (left < margin) left = margin;
      if (left + w > window.innerWidth - margin + scrollX) left = window.innerWidth - w - margin + scrollX;
      if (top + h > scrollY + window.innerHeight - margin) {
        top = scrollY + rect.top - h - 10;
      }
      if (top < margin) top = margin;

      wrapper.style.left = left + 'px';
      wrapper.style.top = top + 'px';
    }

    function clearPreview(){
      wrapper.style.display = 'none';
      wrapper.classList.remove('visible', 'tp-image');
      tpTitle.textContent = '';
      tpMeta.textContent = '';
      tpBody.innerHTML = '';
      tpBody.style.maxHeight = '';
      tpBody.style.padding = '';
    }

    function scheduleHide(){
      window.clearTimeout(hideTimer);
      hideTimer = window.setTimeout(clearPreview, 200);
    }

    function show(){
      wrapper.style.display = 'block';
      wrapper.classList.add('visible');
      window.clearTimeout(hideTimer);
    }

    function fixRelativeUrls(html, baseUrl){
      return html.replace(/(src|href)=["'](?!https?:\/\/|\/\/|#|data:)([^"']+)["']/gi, function(m, attr, url){
        try {
          var resolved = new URL(url, baseUrl).href;
          return attr + '="' + resolved + '"';
        } catch(e) { return m; }
      });
    }

    function stripScripts(html){
      return html.replace(/<script\b[^<]*(?:<\/script>)?/gi, '')
                 .replace(/<noscript\b[^<]*(?:<\/noscript>)?/gi, '');
    }

    function extractMeta(doc){
      var parts = [];
      var metaEl = doc.querySelector('.blog-meta, .quest-meta, .journal-info-row, .quest-info-row');
      if (metaEl) {
        var text = metaEl.textContent.replace(/\s+/g, ' ').trim();
        if (text) parts.push(text);
      }
      var tags = doc.querySelectorAll('.blog-tag-list .bi-tag, .quest-tag-list .bi-tag');
      if (tags.length) {
        parts.push(Array.from(tags).map(function(t){ return t.textContent.trim(); }).join(' · '));
      }
      return parts.join(' · ');
    }

    async function fetchOverview(url){
      if (cache.has(url)) return cache.get(url);
      try{
        var baseUrl = url.replace(/#.*$/, '');
        var hash = url.includes('#') ? url.split('#')[1] : null;
        var res = await fetch(baseUrl, {credentials: 'same-origin'});
        if (!res.ok) return null;
        var text = await res.text();
        var parser = new DOMParser();
        var doc = parser.parseFromString(text, 'text/html');
        var title = (doc.querySelector('h1') && doc.querySelector('h1').textContent.trim()) || doc.title || '';
        var meta = extractMeta(doc);
        var contentEl = doc.querySelector('.garden-flow');
        if (!contentEl) contentEl = doc.querySelector('article');
        if (!contentEl) contentEl = doc.querySelector('main');
        var content = '';
        if (contentEl) {
          content = contentEl.innerHTML;
          content = stripScripts(content);
          content = fixRelativeUrls(content, baseUrl);
        }
        var result = {title: title, meta: meta, content: content, hash: hash};
        cache.set(url, result);
        return result;
      }catch(e){ return null; }
    }

    function escapeId(id){
      return id.replace(/[^a-zA-Z0-9_-]/g, '\\$&');
    }

    function renderPreview(a, data){
      var noText = a.hasAttribute('data-tp-no-text');
      var presetImage = data.image || a.getAttribute('data-tp-image');
      var presetExcerpt = a.getAttribute('data-tp-excerpt');

      tpTitle.textContent = noText ? '' : (data.title || a.getAttribute('data-tp-title') || a.textContent.trim());
      tpMeta.textContent = noText ? '' : (presetExcerpt || data.meta || a.getAttribute('data-tp-meta') || '');
      tpBody.innerHTML = '';
      tpBody.style.padding = '';
      tpBody.style.maxHeight = '';
      wrapper.classList.remove('tp-image');

      if (data.content) {
        var body = document.createElement('div');
        body.innerHTML = data.content;
        var h1 = body.querySelector('h1');
        if (h1) h1.remove();
        tpBody.appendChild(body);
        if (data.hash) {
          var target = tpBody.querySelector('#' + escapeId(data.hash));
          if (target) target.scrollIntoView({block: 'start'});
        }
      } else if (noText && presetImage) {
        wrapper.classList.add('tp-image');
        tpBody.innerHTML = '<img src="' + presetImage.replace(/"/g, '&quot;') + '" alt="" style="width:100%;height:auto;display:block;border-radius:10px;">';
      } else if (presetImage) {
        wrapper.classList.add('tp-image');
        tpBody.innerHTML = '<img src="' + presetImage.replace(/"/g, '&quot;') + '" alt="" style="width:100%;height:auto;display:block;border-radius:0 0 10px 10px;">';
      } else {
        tpBody.textContent = 'Open to read.';
      }
      requestAnimationFrame(function(){ positionTooltip(a); });
    }

    function onEnter(e){
      var a = e.currentTarget;
      var href = a.href;
      var requestId = ++activeRequest;
      window.clearTimeout(hideTimer);
      positionTooltip(a);
      show();

      var presetTitle = a.getAttribute('data-tp-title');
      var presetMeta = a.getAttribute('data-tp-meta');
      var presetImage = a.getAttribute('data-tp-image');
      var noText = a.hasAttribute('data-tp-no-text');
      var hasPresets = presetTitle || presetImage || noText;

      if (hasPresets) {
        renderPreview(a, { title: presetTitle || '', meta: presetMeta || '', image: presetImage || null });
        if (noText || presetImage) return;
      } else {
        tpTitle.textContent = 'Loading\u2026';
        tpMeta.textContent = '';
        tpBody.innerHTML = '<div class="tp-loading">Loading preview\u2026</div>';
      }

      var thisRequest = requestId;
      fetchOverview(href).then(function(data){
        if (thisRequest !== activeRequest) return;
        if (!data) {
          if (hasPresets) return;
          scheduleHide();
          return;
        }
        renderPreview(a, data);
      }).catch(function(){
        if (!hasPresets) scheduleHide();
      });
    }

    function hide(){ scheduleHide(); }

    function setup(){
      try{
        var anchors = Array.from(document.querySelectorAll(selector + ' a, .garden-archive a.bi-post-link, .journal-year-link, .quest-list-link'));
        anchors.forEach(function(a){
          try{
            if (a.closest('.bi-aside, .left-sidebar, .right-sidebar, .toc')) return;
            var href = a.getAttribute('href')||'';
            if (href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
            if (href.endsWith('.pdf')) return;
            var isRelative = href.startsWith('/') || !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(href);
            var sameOrigin = false;
            try{ sameOrigin = (a.hostname === window.location.hostname); }catch(e){}
            var hasPreset = a.hasAttribute('data-tp-title') || a.hasAttribute('data-tp-excerpt') || a.hasAttribute('data-tp-image') || a.hasAttribute('data-tp-no-text');
            if (!(isRelative || sameOrigin || hasPreset)) return;

            var clone = a.cloneNode(true);
            a.parentNode.replaceChild(clone, a);

            clone.classList.add('internal-link','has-preview');
            clone.addEventListener('mouseenter', onEnter);
            clone.addEventListener('mouseleave', hide);
            clone.addEventListener('focus', onEnter);
            clone.addEventListener('blur', hide);
            clone.addEventListener('touchend', hide);
          }catch(e){}
        });
        wrapper.addEventListener('mouseenter', function(){ window.clearTimeout(hideTimer); });
        wrapper.addEventListener('mouseleave', hide);
      }catch(e){}
    }

    window.initLinkPreviews = setup;

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup); else setup();
  })();
</script>
