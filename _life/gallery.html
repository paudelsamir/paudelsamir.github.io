<style>
  .pg-root { max-width: 960px; margin: 0 auto; }
  .pg-header { margin-bottom: 2rem; }
  .pg-header h1 {
    font-size: 2.25rem; font-weight: 700;
    letter-spacing: -0.03em; line-height: 1.2;
    margin-bottom: 0.5rem;
  }
  .pg-header p { font-size: 0.9rem; color: var(--text-muted); }

  .pg-grid {
    column-count: 3;
    column-gap: 0.5rem;
  }

  .pg-item {
    display: inline-block;
    width: 100%;
    margin-bottom: 0.5rem;
    border-radius: 6px;
    overflow: hidden;
  }

  .pg-item-inner {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
  }

  .pg-item-inner:hover {
    box-shadow: 0 0 0 3px var(--bg-base), 0 0 0 5px var(--text-main);
  }

  .pg-img {
    width: 100%;
    height: auto;
    display: block;
    filter: saturate(0.85);
    transition: filter .3s ease;
  }

  .pg-item-inner:hover .pg-img { filter: saturate(1); }

  .pg-caption {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 0.5rem 0.75rem;
    font-family: var(--font-ui); font-size: 0.8rem;
    color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
    pointer-events: none;
  }

  @media (max-width: 1024px) {
    .pg-grid { column-count: 2; }
  }
  @media (max-width: 640px) {
    .pg-grid { column-count: 1; }
  }
</style>
